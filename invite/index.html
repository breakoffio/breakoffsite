<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Join a phone-free break on BreakOff</title>

  <meta name="description" content="A friend invited you to a phone-free break on BreakOff. Open the app to join, or download it from the App Store or Google Play." />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BreakOff" />
  <meta property="og:title" content="Join a phone-free break" />
  <meta property="og:description" content="A friend invited you to a phone-free break. Tap to join." />
  <meta property="og:image" content="https://breakoff.io/og-invite-v2.png" />
  <meta property="og:url" content="https://breakoff.io/invite" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Join a phone-free break" />
  <meta name="twitter:description" content="A friend invited you to a phone-free break. Tap to join." />
  <meta name="twitter:image" content="https://breakoff.io/og-invite-v2.png" />

  <meta name="apple-itunes-app" content="app-id=6751491331" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Friend-invite landing page. Same stack as the app's invite screen
       (components/invite/InviteLayout.tsx): BreakOff wordmark, "[Name]
       invited you to a break", optional message card, BREAK DETAILS,
       Open in BreakOff, App Store. The web cannot choose blocked apps, so
       there is no Blocked Apps section. Shared styles and the Break
       Details partial live in /assets (also used by /s). Content renders
       from the open_invite_public view fetched by code; the only client
       behavior beyond that is the deep-link-then-App-Store fallback. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="/assets/invite.css" />
  <script src="/assets/break-details.js"></script>
</head>
<body>
  <main class="inv-page">
    <div class="inv-col">

      <header class="inv-header">
        <img class="inv-wordmark" src="/assets/wordmark-silver.png" alt="BreakOff" width="133" height="26" />
        <h1 class="inv-title" id="title">Loading invite</h1>
        <p class="inv-subtitle hidden" id="subtitle"></p>
      </header>

      <div class="inv-card inv-message hidden" id="message"></div>

      <div id="details" class="hidden"></div>

      <div class="inv-actions">
        <a class="inv-btn primary" id="open-btn" href="#">Open in BreakOff</a>
        <div class="store-badges inv-badges"><a class="store-badge" href="https://apps.apple.com/us/app/breakoff-digital-wellness/id6751491331?pt=128483515&amp;ct=web-invite&amp;mt=8" target="_blank" rel="noopener"><img src="/assets/badge-app-store.png" alt="Download on the App Store" width="146" height="54"></a><a class="store-badge" href="https://play.google.com/store/apps/details?id=com.breakoffio.breakoff" target="_blank" rel="noopener"><img src="/assets/badge-google-play.png" alt="Get it on Google Play" width="143" height="54"></a></div>
      </div>

    </div>
  </main>

  <script>
    (function () {
      var SUPABASE_URL = 'https://qpoywatpflqdbpfejnas.supabase.co';
      var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwb3l3YXRwZmxxZGJwZmVqbmFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxNTU0OTcsImV4cCI6MjA4NzczMTQ5N30.2hJnOumhVxRLaniBkuX6ukGDHbJ5z4RJgcSC7lysoVw';
      var APP_STORE = /Android/i.test(navigator.userAgent) ? 'https://play.google.com/store/apps/details?id=com.breakoffio.breakoff' : 'https://apps.apple.com/us/app/breakoff-digital-wellness/id6751491331';
      var BD = window.BreakDetails;
      var TICK_MS = 15000;

      var parts = window.location.pathname.split('/').filter(Boolean);
      var qsCode = new URLSearchParams(window.location.search).get('code') || '';
      var code = parts.length >= 2 && parts[0] === 'invite' ? parts[1] : qsCode;

      var el = function (id) { return document.getElementById(id); };

      function setText(id, text) {
        var node = el(id);
        node.textContent = text || '';
        node.classList.toggle('hidden', !text);
      }

      function setNotFound() {
        el('title').textContent = 'This invite is not active';
        setText('subtitle', '');
        setText('message', 'Ask your friend for a fresh link. You can still take a break of your own in BreakOff.');
        el('details').classList.add('hidden');
        var open = el('open-btn');
        open.textContent = 'Get BreakOff';
        open.href = APP_STORE;
        open.onclick = null;
      }

      if (!code || !/^[A-Za-z0-9]{8}$/.test(code)) {
        setNotFound();
        return;
      }

      var openBtn = el('open-btn');
      openBtn.href = 'breakoff://invite/' + code;
      openBtn.onclick = function () {
        setTimeout(function () {
          if (!document.hidden) window.location.href = APP_STORE;
        }, 1600);
      };

      // CURRENT break (kind='break'): time left, end time, mode. Mirrors
      // the app's LiveBreakInvite. invite.name is never shown for these:
      // that column used to carry the host's app-group label.
      function renderCurrent(row) {
        el('title').textContent = BD.headline(null);
        var startMs = row.start_at ? Date.parse(row.start_at) : NaN;
        var endMs = row.end_at ? Date.parse(row.end_at) : NaN;
        function tick() {
          var now = Date.now();
          var remaining = Number.isFinite(endMs) ? endMs - Math.max(Number.isFinite(startMs) ? startMs : now, now) : 0;
          if (Number.isFinite(endMs) && remaining <= 0) {
            el('title').textContent = 'That break already ended';
            setText('message', 'You can still take it. Open BreakOff to start the same length with your own blocked apps.');
            el('details').classList.add('hidden');
            return false;
          }
          BD.render(el('details'), BD.current({
            remainingMs: remaining,
            endsAt: Number.isFinite(endMs) ? BD.clockOfDate(new Date(endMs)) : null,
            mode: row.break_type
          }));
          return true;
        }
        if (tick()) {
          var id = setInterval(function () { if (!tick()) clearInterval(id); }, TICK_MS);
        }
      }

      // FUTURE break (kind='schedule'): duration, date or repeat days,
      // start to end time, mode. Mirrors the app's ScheduleInvite.
      function renderFuture(row) {
        var payload = row.schedule_payload || {};
        el('title').textContent = BD.headline(payload.hostName);
        // No subtitle under the headline (app parity, 2026-09-23).
        setText('subtitle', '');

        var mins = 0;
        if (typeof payload.durationMinutes === 'number' && payload.durationMinutes > 0) {
          mins = payload.durationMinutes;
        } else if (payload.startTime && payload.endTime) {
          var startM = payload.startTime.hour * 60 + (payload.startTime.minute || 0);
          var endM = payload.endTime.hour * 60 + (payload.endTime.minute || 0);
          mins = endM - startM;
          if (mins <= 0) mins += 24 * 60;
        }

        var dates = Array.isArray(payload.oneShotDates) && payload.oneShotDates.length > 0
          ? payload.oneShotDates
          : (payload.oneShotDate ? [payload.oneShotDate] : []);
        var days = Array.isArray(payload.repeatDays) ? payload.repeatDays : [];
        var timeLabel = payload.startTime && payload.endTime
          ? BD.clock(payload.startTime.hour, payload.startTime.minute) + ' to ' + BD.clock(payload.endTime.hour, payload.endTime.minute)
          : '';

        BD.render(el('details'), BD.future({
          durationMinutes: mins,
          dateLabel: dates.length > 0 ? BD.dateList(dates) : BD.repeatDays(days),
          repeats: dates.length === 0,
          timeLabel: timeLabel,
          mode: row.break_type || payload.breakType
        }));
      }

      var url = SUPABASE_URL + '/rest/v1/open_invite_public?code=eq.' + encodeURIComponent(code)
        + '&select=code,name,kind,break_type,start_at,end_at,schedule_payload';
      fetch(url, {
        headers: {
          apikey: SUPABASE_ANON,
          Authorization: 'Bearer ' + SUPABASE_ANON,
        },
      }).then(function (r) {
        return r.ok ? r.json() : [];
      }).then(function (rows) {
        if (!rows || rows.length === 0) {
          setNotFound();
          return;
        }
        var row = rows[0];
        if (row.kind === 'schedule') renderFuture(row);
        else renderCurrent(row);
      }).catch(function () {
        setNotFound();
      });
    })();
  </script>

    try {
      posthog.init('phc_vkUKHJJ6ot5zWo3rdyB94o8Zg2Kv5qrofWRJ6iD5eJEv', {

        capture_pageview: true,
        disable_session_recording: true
      });

</body>
</html>
