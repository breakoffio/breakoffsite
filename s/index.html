<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Add this break to BreakOff</title>

  <meta name="description" content="Add this phone-free break to BreakOff. Free, no account needed." />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BreakOff" />
  <meta property="og:title" content="Add this break to BreakOff" />
  <meta property="og:description" content="Scan to add it to your BreakOff Schedules." />
  <meta property="og:image" content="https://breakoff.io/og-invite-v2.png" />
  <meta property="og:url" content="https://breakoff.io/s" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Add this break to BreakOff" />
  <meta name="twitter:description" content="Scan to add it to your BreakOff Schedules." />
  <meta name="twitter:image" content="https://breakoff.io/og-invite-v2.png" />

  <meta name="apple-itunes-app" content="app-id=6751491331" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Break Acceptance Page (web fallback) for host posters. Same stack
       as /invite and the app's accept screen (components/invite/
       InviteLayout.tsx): BreakOff wordmark, "[Host] invited you to a
       break", optional host message card, BREAK DETAILS, Apps Allowed,
       Open in BreakOff, App Store. Shared styles and the Break Details
       partial live in /assets. All content renders from the
       schedule_shares row fetched by short code; the only client behavior
       beyond that is the deep-link-then-App-Store fallback. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="/assets/invite.css" />
  <script src="/assets/break-details.js"></script>
</head>
<body>
  <main class="inv-page">
    <div class="inv-col">

      <header class="inv-header">
        <img class="inv-wordmark" src="/assets/wordmark-silver.png" alt="BreakOff" width="133" height="26" />
        <h1 class="inv-title" id="title">Loading break</h1>
        <p class="inv-subtitle hidden" id="subtitle"></p>
      </header>

      <div class="inv-card inv-message hidden" id="message"></div>

      <div id="details" class="hidden"></div>

      <section class="inv-section hidden" id="apps-section">
        <div class="inv-eyebrow">Apps allowed</div>
        <div class="inv-chips" id="apps-row"></div>
        <div class="inv-note hidden" id="apps-note">
          <strong>These apps are allowed during this break</strong>
          Keep these unblocked in your group so they stay open during the break. You choose what blocks on your phone.
        </div>
      </section>

      <div class="inv-actions">
        <a class="inv-btn primary" id="open-btn" href="#">Open in BreakOff</a>
        <div class="store-badges inv-badges"><a class="store-badge" href="https://apps.apple.com/us/app/breakoff-digital-wellness/id6751491331?pt=128483515&amp;ct=web-s&amp;mt=8" target="_blank" rel="noopener"><img src="/assets/badge-app-store.png" alt="Download on the App Store" width="146" height="54"></a><a class="store-badge" href="https://play.google.com/store/apps/details?id=com.breakoffio.breakoff" target="_blank" rel="noopener"><img src="/assets/badge-google-play.png" alt="Get it on Google Play" width="143" height="54"></a></div>
      </div>

    </div>
  </main>

  <script>
    (function () {
      var SUPABASE_URL = 'https://qpoywatpflqdbpfejnas.supabase.co';
      var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwb3l3YXRwZmxxZGJwZmVqbmFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxNTU0OTcsImV4cCI6MjA4NzczMTQ5N30.2hJnOumhVxRLaniBkuX6ukGDHbJ5z4RJgcSC7lysoVw';
      var APP_STORE = /Android/i.test(navigator.userAgent) ? 'https://play.google.com/store/apps/details?id=com.breakoffio.breakoff' : 'https://apps.apple.com/us/app/breakoff-digital-wellness/id6751491331';

      // Known category chips: icon tile color + inline SVG glyph. Anything
      // the host typed that we don't recognize renders as a neutral tile
      // with the first letter.
      var CHIP_STYLES = {
        music: { color: '#FA2E44', svg: '<svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M9 17.5a2.5 2.5 0 1 1-2-2.45V7l9-2v8a2.5 2.5 0 1 1-2-2.45V6.2L9 7.6z"></path></svg>' },
        camera: { color: '#3A3A3C', svg: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L16 8h3a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="12.5" r="3"></circle></svg>' },
        phone: { color: '#34C759', svg: '<svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M6.5 4c-1 0-2 .8-2.2 1.9C3.7 11 8.9 17.6 14 18.7c1.1.2 2-.8 2.3-1.8l.4-1.6a1.2 1.2 0 0 0-.7-1.4l-2.4-1a1.2 1.2 0 0 0-1.4.4l-.6.8c-1.7-.9-3-2.2-3.8-3.9l.8-.6a1.2 1.2 0 0 0 .4-1.4l-1-2.4A1.2 1.2 0 0 0 7.3 4z"></path></svg>' },
        calls: { color: '#34C759', svg: '<svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M6.5 4c-1 0-2 .8-2.2 1.9C3.7 11 8.9 17.6 14 18.7c1.1.2 2-.8 2.3-1.8l.4-1.6a1.2 1.2 0 0 0-.7-1.4l-2.4-1a1.2 1.2 0 0 0-1.4.4l-.6.8c-1.7-.9-3-2.2-3.8-3.9l.8-.6a1.2 1.2 0 0 0 .4-1.4l-1-2.4A1.2 1.2 0 0 0 7.3 4z"></path></svg>' },
        messages: { color: '#34C759', svg: '<svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M12 4C6.8 4 3 7.4 3 11.5c0 2.1 1 4 2.7 5.3-.1.9-.5 2.1-1.5 3.2 1.8-.2 3.2-.9 4.1-1.5.9.3 2 .5 3.7.5 5.2 0 9-3.4 9-7.5S17.2 4 12 4z"></path></svg>' },
        maps: { color: '#3478F6', svg: '<svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M12 3a7 7 0 0 0-7 7c0 5 7 11 7 11s7-6 7-11a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 7a2.5 2.5 0 0 1 0 5.5z"></path></svg>' }
      };

      var parts = window.location.pathname.split('/').filter(Boolean);
      // Path form (/s/CODE) via the 404 router redirect, or query form
      // (/s/?code=CODE) directly. The query form also makes local preview
      // servers work without path routing.
      var qsCode = new URLSearchParams(window.location.search).get('code') || '';
      var code = parts.length >= 2 && parts[0] === 's' ? parts[1] : qsCode;

      var el = function (id) { return document.getElementById(id); };

      var BD = window.BreakDetails;
      function parseHHMM(hhmm) {
        var m = /^(\d{2}):(\d{2})/.exec(hhmm || '');
        return m ? { hour: parseInt(m[1], 10), minute: parseInt(m[2], 10) } : null;
      }
      function setText(id, text) {
        var node = el(id);
        node.textContent = text || '';
        node.classList.toggle('hidden', !text);
      }
      function setNotFound() {
        el('title').textContent = 'This link is not active';
        setText('subtitle', '');
        setText('message', 'Ask whoever shared it for a fresh link.');
        el('details').classList.add('hidden');
        el('apps-section').classList.add('hidden');
        var open = el('open-btn');
        open.textContent = 'Get BreakOff';
        open.href = APP_STORE;
        open.onclick = null;
      }

      if (!code || !/^[A-Za-z0-9]{8}$/.test(code)) {
        setNotFound();
        return;
      }


      // Primary CTA: attempt the deep link; if the app didn't take over
      // within a short window (page still visible), fall to the App Store.
      var openBtn = el('open-btn');
      openBtn.href = 'breakoff://share/' + code;
      openBtn.onclick = function () {
        setTimeout(function () {
          if (!document.hidden) window.location.href = APP_STORE;
        }, 1600);
      };

      var url = SUPABASE_URL + '/rest/v1/schedule_shares?code=eq.' + encodeURIComponent(code)
        + '&select=title,duration_minutes,days,start_time,end_time,one_shot_dates,mode,share_type,business_name,description,logo_url,recommended_apps';
      fetch(url, {
        headers: {
          apikey: SUPABASE_ANON,
          Authorization: 'Bearer ' + SUPABASE_ANON,
        },
      }).then(function (r) {
        return r.ok ? r.json() : [];
      }).then(function (rows) {
        if (!rows || rows.length === 0) {
          setNotFound();
          return;
        }
        var row = rows[0];
        var host = (row.business_name || '').trim();
        el('title').textContent = BD.headline(host);
        // No subtitle under the headline (app parity, 2026-09-23).
        setText('subtitle', '');
        // Host-written message in its own subtle card.
        setText('message', (row.description || '').trim());

        // BREAK DETAILS, future emphasis: duration, date or repeat days,
        // start to end time, mode. Instant posters start when tapped.
        var start = parseHHMM(row.start_time);
        var end = parseHHMM(row.end_time);
        var timeLabel = start && end
          ? BD.clock(start.hour, start.minute) + ' to ' + BD.clock(end.hour, end.minute)
          : '';
        var dates = Array.isArray(row.one_shot_dates) ? row.one_shot_dates.filter(Boolean) : [];
        var days = Array.isArray(row.days) ? row.days : [];
        var instant = row.share_type === 'instant' || (dates.length === 0 && days.length === 0);
        BD.render(el('details'), BD.future({
          durationMinutes: row.duration_minutes || 0,
          dateLabel: instant
            ? 'When you tap Start'
            : (dates.length > 0 ? BD.dateList(dates) : BD.repeatDays(days)),
          dateRowLabel: instant ? 'Starts' : undefined,
          repeats: !instant && dates.length === 0,
          timeLabel: instant ? '' : timeLabel,
          mode: row.mode
        }));

        // Apps Allowed chips. Suggestions only; blocking is always the
        // scanner's own choice on their own phone.
        var apps = Array.isArray(row.recommended_apps)
          ? row.recommended_apps.filter(function (a) { return typeof a === 'string' && a; })
          : [];
        var rowEl = el('apps-row');
        if (apps.length === 0) {
          var none = document.createElement('span');
          none.className = 'inv-chip plain';
          none.textContent = 'Your choice';
          rowEl.appendChild(none);
        } else {
          apps.forEach(function (name) {
            var key = name.trim().toLowerCase();
            var style = CHIP_STYLES[key];
            var chip = document.createElement('span');
            chip.className = 'inv-chip';
            var tile = document.createElement('span');
            tile.className = 'inv-tile';
            if (style) {
              tile.style.background = style.color;
              tile.innerHTML = style.svg;
            } else {
              tile.style.background = '#3A3A3C';
              tile.textContent = name.charAt(0).toUpperCase();
            }
            chip.appendChild(tile);
            chip.appendChild(document.createTextNode(name));
            rowEl.appendChild(chip);
          });
          el('apps-note').classList.remove('hidden');
        }
        el('apps-section').classList.remove('hidden');
      }).catch(function () {
        setNotFound();
      });
    })();
  </script>

    try {

</body>
</html>
